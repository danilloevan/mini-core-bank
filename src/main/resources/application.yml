spring:
  application:
    name: mini-core-bank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banco_poo_db}
    username: ${DB_USER:banco_user}
    password: ${DB_PASSWORD:banco_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
